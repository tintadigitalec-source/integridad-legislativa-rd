<title>Nunca sabes qué hallarás</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: cómic noir. Una ciudad de noche al fondo (cielo, luna, ventanas encendidas) y un mazo de cartas de tarot; cada carta tiene escena y color propio según su tema. Móvil primero; #sala es el tablero para proyectar. Un solo look oscuro, colores explícitos. */
:root{
  --night:#17122A;    /* cielo de fondo */
  --night2:#3A2357;   /* horizonte violeta */
  --ink:#141019;      /* tinta de cómic */
  --paper:#F3E8CC;    /* papel envejecido de la carta */
  --mustard:#F2C230;  /* luz de ventana, selección, botones */
  --muted:#6B5F55;
  --c:#4B2A7B;        /* color del tema actual */
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Comic Neue","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.4;
  background:var(--night);
  background-image:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.4px),linear-gradient(180deg,var(--night) 0%,var(--night2) 70%,color-mix(in srgb,var(--c) 60%,var(--night2)) 100%);
  background-size:9px 9px,100% 100%;background-attachment:fixed;transition:background .6s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
#ciudad{position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;z-index:0;opacity:.9}
#ciudad svg{width:100%;height:100%;display:block}
#luna{position:fixed;right:-40px;top:40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFF6D6,#F2DC9A 60%,#E2C277);box-shadow:0 0 60px rgba(242,220,154,.35);pointer-events:none;z-index:0;opacity:.9}
.wrap{max-width:440px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.screen{display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-size:15px;letter-spacing:.08em}
.top b{background:var(--mustard);color:var(--ink);padding:3px 10px 2px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:400}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:.95;letter-spacing:.03em;text-wrap:balance}
h2{font-size:38px;color:var(--mustard);text-shadow:3px 3px 0 var(--ink)}
.lead{font-size:17px;margin:0;max-width:40ch}
.small{font-size:14px;margin:0}
/* recuadro de narración de cómic */
.caption{background:var(--mustard);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 14px;font-weight:700;font-size:15.5px}
.captions{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.captions li:nth-child(even){transform:rotate(.6deg);margin-left:14px}
.captions li:nth-child(odd){transform:rotate(-.5deg);margin-right:14px}
.logos{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--ink);border:2px solid rgba(243,232,204,.25);padding:10px 16px}
.logos img{display:block;height:auto}
.logos .lt{width:46px}
.logos .li{width:150px}
.logos .sep{width:2px;align-self:stretch;background:rgba(255,255,255,.3)}
.salahead .logos .lt{width:52px}.salahead .logos .li{width:170px}
.btn{background:var(--mustard);color:var(--ink);border:3px solid var(--ink);padding:13px 22px 11px;font-family:var(--display);font-size:24px;letter-spacing:.06em;box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;text-align:center}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.paper{background:var(--paper)}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;font-weight:700;padding:8px 0;color:inherit}

/* ---------- carta de tarot ---------- */
.tarot{position:relative;background:var(--paper);border-radius:16px;padding:12px;box-shadow:0 26px 40px -18px rgba(0,0,0,.8),inset 0 0 0 2px rgba(20,16,25,.25)}
.tarot .frame{border:3px solid var(--ink);display:flex;flex-direction:column;background:var(--paper);height:100%}
.tarot .num{font-family:var(--display);font-size:26px;text-align:center;letter-spacing:.12em;padding:4px 0 2px;border-bottom:3px solid var(--ink);color:var(--ink)}
.tarot .art{flex:1;line-height:0;overflow:hidden;position:relative;min-height:0}
.tarot .art svg{width:100%;height:100%;display:block}
.tarot .name{font-family:var(--display);font-size:30px;text-align:center;letter-spacing:.1em;padding:6px 8px 3px;border-top:3px solid var(--ink);color:var(--ink);line-height:1}
.tarot .name small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;opacity:.8}
.hero{height:500px;transform:rotate(-1.5deg)}

/* ---------- código de colores ---------- */
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mini{background:var(--paper);border-radius:10px;padding:6px;box-shadow:0 10px 18px -10px rgba(0,0,0,.8)}
.mini .frame{border:2px solid var(--ink)}
.mini .art{height:92px;line-height:0;overflow:hidden}
.mini .art svg{width:100%;height:100%}
.mini b{display:block;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em;color:var(--ink);text-align:center;border-top:2px solid var(--ink);padding:4px 4px 1px;line-height:1}
.mini small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-align:center;padding-bottom:4px}

/* ---------- mesas ---------- */
.doors{display:grid;gap:14px}
.door{display:grid;grid-template-columns:86px 1fr;text-align:left;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.6);padding:0;overflow:hidden;transition:transform .12s}
.door:hover{transform:translate(-2px,-2px)}
.door .art{line-height:0;border-right:3px solid var(--ink)}
.door .art svg{width:86px;height:100%;min-height:96px}
.door span.t{padding:12px 14px}
.door strong{display:block;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;line-height:1}
.door small{font-size:14.5px;font-weight:700}

/* ---------- juego ---------- */
.hud{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.pip{width:12px;height:18px;border-radius:3px;background:rgba(243,232,204,.2);border:1.5px solid rgba(243,232,204,.35)}
.pip.done{background:var(--paper);border-color:var(--paper)}
.pip.now{background:var(--mustard);border-color:var(--ink);transform:translateY(-3px)}
.counter{font-family:var(--display);font-size:20px;letter-spacing:.06em}
.stage{perspective:1600px}
.card{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);min-height:540px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{cursor:pointer}
.back.tarot{height:100%}
.front{transform:rotateY(180deg);background:var(--paper);color:var(--ink);border-radius:16px;padding:12px;box-shadow:0 26px 40px -18px rgba(0,0,0,.8)}
.front .frame{border:3px solid var(--ink);padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px;min-height:100%;
  background-image:radial-gradient(rgba(20,16,25,.07) 1px,transparent 1.2px);background-size:6px 6px}
.card.flipped .front{position:relative}
.card.flipped .back{position:absolute;pointer-events:none}
.card.open{transform:none!important;transition:none}
.card.open .front{transform:none;backface-visibility:visible;-webkit-backface-visibility:visible}
.card.open .back{display:none}
.band{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:19px;letter-spacing:.08em;border-bottom:3px solid var(--ink);padding-bottom:6px;margin:-4px -4px 0}
.band span:last-child{background:var(--c);color:var(--paper);padding:3px 9px 1px;border:2px solid var(--ink)}
.ref{margin:0;font-size:14px;font-style:italic;border-left:4px solid var(--c);padding:4px 0 4px 10px}
.qtext{font-weight:700;font-size:21px;line-height:1.25;margin:0;text-wrap:pretty}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:#FFFBEF;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:9px 13px;font-weight:700;font-size:16px;color:var(--ink);transition:transform .08s}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.sel{background:var(--mustard)}
.opt.pnr{background:transparent;box-shadow:none;border-style:dashed;font-weight:400;color:var(--muted)}
.opt.pnr.sel{background:#D9CBB0;color:var(--ink);border-style:solid}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{text-align:center;font-family:var(--display);font-size:30px;font-weight:400;padding:6px 0 2px}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.write{width:100%;min-height:140px;resize:vertical;border:2.5px solid var(--ink);background:#FFFBEF;padding:12px;font:700 17px/1.4 var(--body);color:var(--ink);box-shadow:inset 3px 3px 0 rgba(20,16,25,.08)}
.write.one{min-height:0;font:400 30px var(--display);letter-spacing:.04em}
.write.sm{min-height:84px;margin-top:8px;font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:10px;font-weight:700}
.why{border-top:2px dashed var(--ink);padding-top:10px}
.why summary{cursor:pointer;font-weight:700;font-size:15px}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:auto;flex-wrap:wrap}
.actions .btn{flex:1;min-width:150px;font-size:22px}
.fliphint{text-align:center;font-weight:700;font-size:15px;margin:0}

/* ---------- final ---------- */
.hand{display:flex;justify-content:center;height:190px;margin-top:6px}
.hand .mini{width:96px;height:150px;margin:0 -22px;transform-origin:bottom center}
.hand .mini .art{height:112px}

/* ---------- sala ---------- */
body.sala .wrap{max-width:1240px}
.salahead{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.salahead h2{font-size:clamp(40px,5vw,64px)}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.f{border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 14px 5px;font-family:var(--display);font-size:19px;letter-spacing:.05em;box-shadow:3px 3px 0 var(--ink)}
.f.on{background:var(--mustard)}
.stats{display:flex;flex-wrap:wrap;gap:8px;font-weight:700;font-size:15px}
.stat{background:rgba(243,232,204,.12);border:1.5px solid rgba(243,232,204,.35);padding:5px 12px;font-variant-numeric:tabular-nums}
.stat i{display:inline-block;width:11px;height:11px;border:1.5px solid var(--paper);margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.res{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:7px 7px 0 rgba(0,0,0,.55)}
.res header{background:var(--c);color:var(--paper);padding:10px 14px 12px;border-bottom:3px solid var(--ink)}
.res header .tag{font-family:var(--display);font-size:16px;letter-spacing:.08em;background:var(--ink);padding:2px 8px 0;display:inline-block}
.res header h3{font-family:var(--body);font-weight:700;font-size:17px;line-height:1.25;margin-top:8px;letter-spacing:0}
.res .body{padding:14px 16px 16px}
.wide{grid-column:1/-1}
.big .res header h3{font-size:clamp(22px,2.6vw,34px);line-height:1.15}
.big .row{font-size:clamp(16px,1.6vw,22px);grid-template-columns:minmax(0,1fr) 80px;margin-bottom:14px}
.big .bar{height:26px}
.big .pct{font-size:clamp(22px,2.2vw,32px)}
.big .cloud span{transform:scale(1.4);margin:8px 18px}
.sel{border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);font:700 15px var(--body);padding:8px 10px;max-width:min(100%,560px)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:3px 10px;align-items:center;margin-bottom:9px;font-size:14.5px}
.row .lab{grid-column:1/-1;font-weight:700}
.bars{display:grid;gap:3px}
.bar{height:13px;background:#E3D6B8;border:1.5px solid var(--ink);overflow:hidden}
.bar b{display:block;height:100%;background:var(--c);transition:width .6s}
.pct{font-family:var(--display);font-size:17px;letter-spacing:.03em;text-align:right;line-height:1.05}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;font-weight:700;margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.gap{margin-top:8px;font-weight:700;font-size:15px}
.cloud{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:center;padding:8px 0}
.cloud span{font-family:var(--display);letter-spacing:.04em;line-height:1}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;max-height:520px;overflow:auto;padding:6px}
.notes p{margin:0;padding:12px 13px;background:#FFFBEF;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:15px;font-weight:700;line-height:1.35;transform:rotate(var(--rot,0deg))}
.wait{font-weight:700;font-size:15px;margin:0}
.note{background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:14px 16px}
.qrbox{display:flex;gap:14px;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:10px 16px 10px 10px}
.qr{line-height:0}
.qr img,.qr canvas{width:112px;height:112px}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.keyrow input{border:2.5px solid var(--ink);padding:9px 12px;font:700 15px var(--body);width:190px;background:var(--paper);color:var(--ink)}
.demo{background:var(--mustard);color:var(--ink);border:2px solid var(--ink);font-family:var(--display);font-size:16px;letter-spacing:.06em;padding:3px 10px 1px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){.card,.bar b,.btn,.door,body{transition:none}}
</style>

<div id="luna" aria-hidden="true"></div>
<div id="ciudad" aria-hidden="true"></div>
<div class="wrap" id="app"></div>

function rnd(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647}}
function skyline(w,h,base,seed,opts={}){
  const r=rnd(seed); let x=-4, g="";
  while(x<w){
    const bw=14+r()*(w/6), bh=h*(.25+r()*.6), y=base-bh;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(bh+40).toFixed(1)}" fill="${INK}"/>`;
    if(r()<.35){const sw=bw*.4;g+=`<rect x="${(x+bw/2-sw/2).toFixed(1)}" y="${(y-bh*.12).toFixed(1)}" width="${sw.toFixed(1)}" height="${(bh*.12+1).toFixed(1)}" fill="${INK}"/>`}
    if(r()<.2)g+=`<path d="M${(x+bw/2-3).toFixed(1)} ${y.toFixed(1)}L${(x+bw/2).toFixed(1)} ${(y-bh*.3).toFixed(1)}L${(x+bw/2+3).toFixed(1)} ${y.toFixed(1)}z" fill="${INK}"/>`;
    const ww=Math.max(2.2,bw/9), cols=Math.floor((bw-4)/(ww*2));
    for(let cy=y+6;cy<base-4;cy+=ww*2.4){for(let k=0;k<cols;k++){if(r()<(opts.lit||.45))g+=`<rect x="${(x+4+k*ww*2).toFixed(1)}" y="${cy.toFixed(1)}" width="${ww.toFixed(1)}" height="${(ww*1.4).toFixed(1)}" fill="${opts.luz||LUZ}"/>`}}
    x+=bw+(r()<.3?r()*6:0);
  }
  return g;
}
function fondoCiudad(){
  const el=document.getElementById("ciudad"); if(!el)return;
  el.innerHTML=`<svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice">${skyline(800,300,300,11,{lit:.32})}</svg>`;
}

/* Mazo: núcleo común, preguntas de la mesa y la palabra al final. Las preguntas 1 y 5 cierran con la carta de la sala. */
function mazo(p){
  const out=[];
  const add=q=>{out.push(q); if(q.adivina) out.push({...q,id:q.id+"g",base:q.id,guess:true,pnr:false,tema:"sala",
    ref:q.q,q:"¿Qué cree que respondió la mayoría de la sala?"})};
  COMUNES.forEach(add); PROPIAS[p].forEach(add); add(PALABRA);
  return out;
}

  if(w){

}

let SALA={modo:"una",q:"c2",f:"todos",datos:[],timer:null,clave:store.get("hallaras_clave",""),msg:null};

function demoDatos(){
  // Datos de ejemplo para ensayar la proyección, mezclados con lo respondido en este dispositivo.
  let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const pick=(arr,w)=>{let t=r()*w.reduce((a,b)=>a+b,0);for(let k=0;k<arr.length;k++){t-=w[k];if(t<=0)return arr[k]}return arr[arr.length-1]};
  const palabras=["Voluntad","Coordinación","Transparencia","Justicia","Voluntad","Datos","Presupuesto","Valentía","Control","Voluntad","Educación","Integridad","Independencia","Transparencia","Seguimiento"];
  const notas=["(Ejemplo) Se nota en los negocios que aparecen de la nada y nadie pregunta de dónde sale el dinero.","(Ejemplo) Cuando pedimos información, la respuesta llega tarde o incompleta.","(Ejemplo) Las leyes salen sin reglamento y cada institución interpreta a su manera.","(Ejemplo) Falta que alguien dé seguimiento después de aprobar.","(Ejemplo) Hay miedo a hablar, aunque nadie lo diga en voz alta."];
  const out=[];
  ["sc","ej","dp"].forEach((p,pi)=>{
    const N=[14,11,9][pi];
    for(let k=0;k<N;k++){
      const a={};
      mazo(p).forEach(c=>{
        if(c.tipo==="palabra")a[c.id]=palabras[Math.floor(r()*palabras.length)];
        else if(c.tipo==="abierta"){if(r()<.75)a[c.id]=notas[Math.floor(r()*notas.length)]}
        else if(c.tipo==="escala"){const w=c.id.startsWith("c5")?[3,4,3,1,1]:[1,2,3,4,2];a[c.id]=pick([1,2,3,4,5],w)}
        else{const ops=c.ops.concat(c.pnr?[PNR]:[]);a[c.id]=pick(ops,ops.map((_,j)=>ops.length-j+(j===1?3:0)))}
        if(!c.guess&&c.tipo!=="abierta"&&c.tipo!=="palabra"&&r()<.25)a[c.id+"_x"]=notas[Math.floor(r()*notas.length)];
      });
      out.push({p,a});
    }
  });
  return out.concat(store.get("hallaras_demo",[]));
}
async function cargar(){
  if(!ENDPOINT){SALA.datos=demoDatos();return null}
  if(!SALA.clave)return "Escriba la clave de sala para ver los resultados.";
  try{
    const j=await (await fetch(ENDPOINT+"?clave="+encodeURIComponent(SALA.clave)+"&t="+Date.now(),{credentials:"omit"})).json();
    if(!j.ok)return j.error==="clave"?"La clave no coincide con la del Apps Script.":"No pudimos leer los resultados.";
    SALA.datos=j.filas||[];return null;
  }catch(e){return "Sin conexión con la hoja de respuestas. Reintentamos solos en unos segundos."}
}

const claves=q=>q.tipo==="escala"?[1,2,3,4,5].concat(q.pnr?[PNR]:[]):q.ops.concat(q.pnr?[PNR]:[]);
const pct=(a,b)=>b?Math.round(a*100/b):0;
const lab=(q,k)=>q.tipo==="escala"&&k!==PNR?k+(k===1?" · "+q.lo:k===5?" · "+q.hi:""):k;

    </div>
    <div class="keyrow"><label class="small" for="pq" style="font-weight:700">Pregunta en pantalla</label>
      <select id="pq" class="sel">${preguntasSala().map(q=>`<option value="${q.id}" ${SALA.q===q.id?"selected":""}>${esc(q.etq)}</option>`).join("")}</select>
      <button class="f" id="modo">${SALA.modo==="una"?"Ver todas":"Ver solo una"}</button></div>
    ${ENDPOINT?`<div class="keyrow"><input id="clave" type="password" placeholder="Clave de sala" value="${esc(SALA.clave)}" aria-label="Clave de sala"><button class="f" id="usar">Ver resultados</button></div>`:`<span class="demo">Datos de ejemplo · modo demostración</span>`}
    <div class="filters" id="filtros">${[["todos","Los tres públicos"]].concat(Object.entries(PUBLICOS).map(([k,v])=>[k,v.corto])).map(([k,l])=>`<button class="f ${SALA.f===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
    <div class="stats" id="stats"></div>
    <div class="grid" id="res"><p class="wait">Cargando respuestas…</p></div>
    <button class="link" id="jugar">Abrir el juego</button>
  </section>`;
  try{new QRCode($("#qr"),{text:location.href.split("#")[0],width:224,height:224,colorDark:"#141019",colorLight:"#F3E8CC"})}catch(e){$("#qr").parentElement.hidden=true}
  $("#filtros").querySelectorAll(".f").forEach(b=>b.onclick=()=>{SALA.f=b.dataset.f;$("#filtros").querySelectorAll(".f").forEach(x=>x.classList.toggle("on",x===b));pintar()});
  if($("#usar"))$("#usar").onclick=()=>{SALA.clave=$("#clave").value.trim();store.set("hallaras_clave",SALA.clave);refrescar()};
  $("#jugar").onclick=()=>{location.hash=""};
  $("#pq").onchange=e=>{SALA.q=e.target.value;SALA.modo="una";$("#modo").textContent="Ver todas";pintar()};
  $("#modo").onclick=()=>{SALA.modo=SALA.modo==="una"?"todas":"una";$("#modo").textContent=SALA.modo==="una"?"Ver todas":"Ver solo una";pintar()};
  refrescar(); SALA.timer=setInterval(refrescar,15000);
}

function simple(q,filas){const {c,n}=conteo(filas,q.id);return claves(q).map(k=>`<div class="row"><span class="lab">${esc(lab(q,k))}</span><div class="bar"><b style="width:${pct(c[k]||0,n)}%"></b></div><span class="pct">${pct(c[k]||0,n)}%</span></div>`).join("")}
function comparado(q,porP){
  const vis=Object.keys(porP).filter(p=>porP[p].length>=5);
  if(!vis.length)return `<p class="wait">Esperando al menos 5 respuestas por grupo.</p>`;
  const cs=Object.fromEntries(vis.map(p=>[p,conteo(porP[p],q.id)]));
  return `<div class="legend">${vis.map(p=>`<span><i style="background:${PUBLICOS[p].color}"></i>${PUBLICOS[p].corto}</span>`).join("")}</div>`+
    claves(q).map(k=>`<div class="row"><span class="lab">${esc(lab(q,k))}</span><div class="bars">${vis.map(p=>`<div class="bar"><b style="width:${pct(cs[p].c[k]||0,cs[p].n)}%;background:${PUBLICOS[p].color}"></b></div>`).join("")}</div><span class="pct">${vis.map(p=>pct(cs[p].c[k]||0,cs[p].n)+"%").join("<br>")}</span></div>`).join("");
}
function adivina(q,filas){
  const real=conteo(filas,q.id),cree=conteo(filas,q.id+"g");
  const top=o=>Object.entries(o.c).filter(([k])=>k!==PNR).sort((a,b)=>b[1]-a[1])[0];
  const tr=top(real),tc=top(cree),ok=tr&&tc&&String(tr[0])===String(tc[0]);
  return `<div class="legend"><span><i style="background:#141019"></i>Lo que respondimos</span><span><i style="background:#F2C230"></i>Lo que creímos que respondería la sala</span></div>`+
    claves({...q,pnr:false}).map(k=>`<div class="row"><span class="lab">${esc(lab(q,k))}</span><div class="bars"><div class="bar"><b style="width:${pct(real.c[k]||0,real.n)}%;background:#141019"></b></div><div class="bar"><b style="width:${pct(cree.c[k]||0,cree.n)}%;background:#F2C230"></b></div></div><span class="pct">${pct(real.c[k]||0,real.n)}%<br>${pct(cree.c[k]||0,cree.n)}%</span></div>`).join("")+
    (tr&&tc?`<div class="gap" style="--c:#F2C230">${ok?`La sala se conoce bien: la mayoría creyó «${esc(tc[0])}» y así fue.`:`La sala creyó que ganaría «${esc(tc[0])}», pero lo más elegido fue «${esc(tr[0])}».`}</div>`:"");
}
function nube(filas){
  const c={};filas.forEach(f=>{let w=String(f.a&&f.a.c7||"").trim();if(!w)return;w=w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();c[w]=(c[w]||0)+1});
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,40);if(!arr.length)return `<p class="wait">Aún no hay palabras.</p>`;
  const max=arr[0][1],cols=["#141019","#B3132B","#2B4C9B","#5A2E8C","#2E6E5E","#B4501A"];
  return `<div class="cloud">${arr.map(([w,n],i)=>`<span style="font-size:${18+Math.round(36*n/max)}px;color:${cols[i%cols.length]}">${esc(w)}</span>`).sort(()=>.5-Math.random()).join("")}</div>`;
}
function notas(filas,id){
  const t=filas.map(f=>f.a&&f.a[id]).filter(v=>v&&String(v).trim()&&v!==PNR);
  if(!t.length)return `<p class="wait">Aún no hay comentarios escritos.</p>`;
  return `<p class="small" style="margin-bottom:10px">${t.length} ${t.length===1?"comentario":"comentarios"} · en orden aleatorio</p><div class="notes">${t.map(v=>`<p style="--rot:${(Math.random()*3-1.5).toFixed(1)}deg">${esc(v)}</p>`).sort(()=>.5-Math.random()).join("")}</div>`;
}

async function refrescar(){SALA.msg=await cargar();pintar()}

function cuerpo(q,filas,porP,f){
  if(q.tipo==="abierta")return notas(filas,q.id);
  const barras=f==="todos"&&!q.adivina?comparado(q,porP):simple(q,filas);
  const com=filas.filter(r=>r.a&&r.a[q.id+"_x"]).length;
  return barras+(com?`<details class="why" style="margin-top:12px"><summary>Lo que escribieron (${com})</summary><div style="margin-top:10px">${notas(filas,q.id+"_x")}</div></details>`:"");
}

function preguntasSala(){
  const L=[];
  COMUNES.forEach(q=>{L.push({...q,etq:"Todos · "+q.q});if(q.adivina)L.push({...q,id:q.id+"·sala",adiv:true,etq:"Todos · ¿Qué cree que respondió la sala? ("+q.q.slice(0,40)+"…)"})});
  L.push({...PALABRA,etq:"Todos · "+PALABRA.q});
  Object.entries(PROPIAS).forEach(([p,arr])=>arr.forEach(q=>L.push({...q,solo:p,etq:PUBLICOS[p].corto+" · "+q.q})));
  return L;
}

function pintar(){
  const res=$("#res");if(!res)return;
  if(SALA.msg){res.innerHTML=`<div class="note"><p class="wait">${esc(SALA.msg)}</p></div>`;$("#stats").innerHTML="";return}
  const porP={sc:[],ej:[],dp:[]};SALA.datos.forEach(f=>{if(porP[f.p])porP[f.p].push(f)});
  $("#stats").innerHTML=`<span class="stat">${SALA.datos.length} manos entregadas</span>`+Object.entries(PUBLICOS).map(([k,v])=>`<span class="stat"><i style="background:${v.color}"></i>${v.corto}: ${porP[k].length}</span>`).join("");
  const f=SALA.f,filas=f==="todos"?SALA.datos:porP[f];
  if(filas.length<5){res.innerHTML=`<div class="note"><p class="wait">Mostramos resultados cuando hay al menos 5 respuestas en este grupo, para cuidar el anonimato. Van ${filas.length}.</p></div>`;return}
  if(SALA.modo==="una"){
    const q=preguntasSala().find(x=>x.id===SALA.q)||preguntasSala()[1];
    let fl=filas, f2=f;
    if(q.solo&&f!==q.solo){fl=porP[q.solo];f2=q.solo}
    if(fl.length<5){res.innerHTML=`<div class="note"><p class="wait">Esta pregunta aparece cuando haya al menos 5 respuestas. Van ${fl.length}.</p></div>`;return}
    const html=q.tipo==="palabra"?nube(fl):q.adiv?adivina(COMUNES.find(c=>c.id===q.id.split("·")[0]),fl):cuerpo(q,fl,porP,f2);
    res.innerHTML=`<div class="big wide">${panel(q.q,q.adiv?"sala":q.tema,html,true)}</div>`;return;
  }
  const out=[panel(PALABRA.q,"criterios",nube(filas),true)];

  COMUNES.forEach(q=>{
    out.push(panel(q.q,q.tema,cuerpo(q,filas,porP,f)));
    if(q.adivina)out.push(panel(q.q,"sala",adivina(q,filas)));
  });
  if(f!=="todos"){
    PROPIAS[f].forEach(q=>out.push(panel(q.q,q.tema,cuerpo(q,filas,porP,f),q.tipo==="abierta")));
  }
  res.innerHTML=out.join("");
}

function ruta(){if(location.hash==="#sala")sala();else{clearInterval(SALA.timer);inicio()}}
window.addEventListener("hashchange",ruta);
fondoCiudad();
ruta();

</script>
